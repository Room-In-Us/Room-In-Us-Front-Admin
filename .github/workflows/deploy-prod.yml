name: Build and Deploy Admin App (prod)

on:
  push:
    branches: [main]
  workflow_dispatch: # 첫 배포 검증 / 롤백 재실행용

# 배포 중 취소는 컨테이너가 없는 상태를 만들 수 있으므로 false
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: room-in-us/room-in-us-front-admin
  # dev 가 latest 를 쓰므로 prod 는 반드시 분리할 것.
  # 같은 태그를 쓰면 develop 푸시가 운영 이미지를 덮어씁니다.
  PROD_IMAGE_TAG: prod-latest

jobs:
  build-and-push:
    # 운영 인스턴스가 aarch64(OCI Ampere)이므로 arm64 네이티브 러너에서 빌드합니다.
    # QEMU 에뮬레이션 대비 훨씬 빠릅니다. public 레포는 이 러너가 무료입니다.
    runs-on: ubuntu-24.04-arm
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PROD_IMAGE_TAG }}
            type=sha,format=short,prefix=prod-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # compose 파일의 원본은 레포입니다. 서버에는 배포할 때마다 덮어씁니다.
      # 서버에서 직접 수정하지 마세요 — 다음 배포 때 되돌아갑니다.
      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "deploy/prod/docker-compose.yml"
          target: "~/roominus/prod/frontend-admin"
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu

            DIR="$HOME/roominus/prod/frontend-admin"
            SERVICE="frontend-admin"

            echo "=== Logging into GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            cd "$DIR"

            echo "=== Pulling image ==="
            docker compose pull --quiet "$SERVICE"

            echo "=== Recreating container ==="
            docker compose up -d --no-deps "$SERVICE"

            echo "=== Health check ==="
            OK=0
            for i in $(seq 1 20); do
              if docker exec "$SERVICE" node -e "
                require('http').get('http://127.0.0.1:3000/', r => {
                  process.exit(r.statusCode < 500 ? 0 : 1)
                }).on('error', () => process.exit(1))
              " 2>/dev/null; then
                OK=1; echo "✓ responding (attempt $i)"; break
              fi
              sleep 3
            done

            if [ "$OK" != "1" ]; then
              echo "✗ 컨테이너가 응답하지 않습니다"
              docker compose logs --tail 80 "$SERVICE" || true
              exit 1
            fi

            docker compose ps
            docker image prune -f
            echo "✓ Deployment complete!"